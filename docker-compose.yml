services:
  postgres:
    image: postgres:17-alpine
    container_name: coretrust-postgres
    environment:
      POSTGRES_DB: coretrust
      POSTGRES_USER: coretrust
      POSTGRES_PASSWORD: coretrust
    ports:
      - "5433:5432"   # host 5433 so it doesn't clash with a locally installed Postgres on 5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coretrust -d coretrust"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: coretrust-app
    profiles: ["app"]   # only starts with: docker compose --profile app up
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: coretrust
      DB_USERNAME: coretrust
      DB_PASSWORD: coretrust
    ports:
      - "8080:8080"

volumes:
  postgres-data:

spring.application.name=coretrust-bank

# ---------- Database ----------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coretrust}
spring.datasource.username=${DB_USERNAME:coretrust}
spring.datasource.password=${DB_PASSWORD:coretrust}
spring.datasource.hikari.maximum-pool-size=10

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Web / Errors ----------
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never
server.error.include-message=never
server.port=8080

# ---------- Logging ----------
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET:Y29yZXRydXN0LWRldi1zZWNyZXQta2V5LWNoYW5nZS1tZS1ub3chIQ==}
app.jwt.issuer=coretrust-bank
# token-ttl    = how long one token lasts before the "extend?" prompt
# max-lifetime = fixed session end; one extension runs up to this point
app.jwt.sessions.customer.token-ttl=15m
app.jwt.sessions.customer.max-lifetime=30m
app.jwt.sessions.admin.token-ttl=15m
app.jwt.sessions.admin.max-lifetime=30m
app.jwt.sessions.support.token-ttl=30m
app.jwt.sessions.support.max-lifetime=60m

# ---------- Bootstrap admin (dev only) ----------
app.bootstrap.admin.name=CoreTrust Admin
app.bootstrap.admin.email=${ADMIN_EMAIL:admin@coretrust.com}
app.bootstrap.admin.phone=${ADMIN_PHONE:9000000000}
app.bootstrap.admin.password=${ADMIN_PASSWORD:Admin@12345}

# ---------- Swagger / OpenAPI ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ---------- Accounts ----------
app.accounts.max-per-user=5

# ---------- Pagination ----------
spring.data.web.pageable.max-page-size=100

# ---------- Mail (Mailpit locally; a real SMTP/AWS SES later) ----------
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
app.mail.from=CoreTrust Bank <no-reply@coretrust.com>

# ---------- OTP ----------
app.otp.ttl=5m
app.otp.max-attempts=3

# ---------- Bank identity ----------
app.bank.name=CoreTrust Bank
app.bank.ifsc=CTRB0001001

# ---------- Transfers ----------
app.transfers.max-amount=200000

# ---------- Time zone for business dates (filters, statements) ----------
app.timezone=Asia/Kolkata

# ---------- Statements ----------
app.statements.max-range-days=366

# ---------- Password setup links ----------
app.password-setup.ttl=24h
app.frontend.set-password-url=${FRONTEND_SET_PASSWORD_URL:http://localhost:3000/set-password}

# ---------- Password reset links ----------
app.password-reset.ttl=30m
app.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:http://localhost:3000/reset-password}

# ---------- Redis (Memurai locally) ----------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Fail fast if Redis is unreachable, so requests aren't held up
spring.data.redis.timeout=500ms

# ---------- Rate limits ----------
app.rate-limits.policies.login-ip.limit=30
app.rate-limits.policies.login-ip.window=15m
app.rate-limits.policies.login-failures.limit=5
app.rate-limits.policies.login-failures.window=15m
app.rate-limits.policies.otp-issue.limit=5
app.rate-limits.policies.otp-issue.window=15m
app.rate-limits.policies.forgot-password-email.limit=3
app.rate-limits.policies.forgot-password-email.window=1h
app.rate-limits.policies.forgot-password-ip.limit=10
app.rate-limits.policies.forgot-password-ip.window=1h
app.rate-limits.policies.beneficiary-lookup.limit=20
app.rate-limits.policies.beneficiary-lookup.window=10m

# ---------- Kafka ----------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Wait until the broker has safely stored the event before calling it sent
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Fail within seconds if Kafka is down, instead of blocking for a minute
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000

# ---------- Outbox publisher ----------
app.outbox.poll-interval-ms=2000
app.outbox.batch-size=50

# ---------- Kafka consumers ----------
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# One consumer thread per partition
spring.kafka.listener.concurrency=3

# ---------- Risk monitoring ----------
app.risk.high-value-threshold=100000
app.rate-limits.policies.transfer-failures.limit=5
app.rate-limits.policies.transfer-failures.window=10m
# =====================================================================
# Production profile. Activate with:  SPRING_PROFILES_ACTIVE=prod
# Secrets come ONLY from environment variables. No defaults: if one is
# missing, the app refuses to start instead of running with a dev value.
# =====================================================================

# ---------- Secrets and connections ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}

app.jwt.secret=${JWT_SECRET}

app.bootstrap.admin.email=${ADMIN_EMAIL}
app.bootstrap.admin.phone=${ADMIN_PHONE}
app.bootstrap.admin.password=${ADMIN_PASSWORD}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

app.frontend.set-password-url=${FRONTEND_SET_PASSWORD_URL}
app.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ---------- No API documentation in production ----------
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ---------- Behind a load balancer ----------
# Trust X-Forwarded-For / -Proto from the proxy, so audit logs and rate limits see real client IPs.
# Only safe when clients can't reach the app directly, bypassing the proxy.
server.forward-headers-strategy=native

# ---------- Logs: JSON for log collectors, no SQL ----------
logging.structured.format.console=ecs
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# ---------- Shutdown: finish in-flight requests first ----------
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# ---------- Separate test database (never the real one) ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/coretrust_test
spring.datasource.username=${DB_USERNAME:coretrust}
spring.datasource.password=${DB_PASSWORD:coretrust}
# Concurrency tests run 10 threads at once
spring.datasource.hikari.maximum-pool-size=20
# Fresh schema on every run, dropped afterwards
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=validate
# Allowed ONLY for the test database: every run starts from a clean, freshly migrated schema
spring.flyway.clean-disabled=false

# ---------- Kafka off ----------
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
app.outbox.publisher-enabled=false

# ---------- Redis cache off ----------
app.cache.redis-enabled=false

# ---------- Quieter logs ----------
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN